name: Build AlliedModders Extension

on:
  push:
    branches:
      - master
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - master
      - main

jobs:
  build-release-extension:
    uses: srcdslab/ci-workflows/.github/workflows/shared_build_release_am_extension.yml@v1
    with:
      sdks: "css"

  build-plugin:
    name: Build plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup SourcePawn compiler
        uses: rumblefrog/setup-sp@v1.3.1
        with:
          version: "1.12.x"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build sourcemod plugin
        working-directory: package/addons/sourcemod/scripting
        run: |
          set -euo pipefail
          mkdir -p ../plugins
          spcomp -E -i include -o ../plugins/DynamicTargeting.smx DynamicTargeting.sp

      - name: Upload plugin
        uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: package/addons/sourcemod/plugins/DynamicTargeting.smx
          if-no-files-found: error
          retention-days: 14
